name: CI — node

on:
  push:
    branches: [dev, main]
    paths:
      - "demo/**"
      - "infra/setup/**"
      - "infra/docker/**"
      - "infra/wrangler/**"
      - "shared/test-vectors.json"
      - "ui/**"
      - "worker/**"
      - ".github/workflows/ci-node.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
  pull_request:
    paths:
      - "demo/**"
      - "infra/setup/**"
      - "infra/docker/**"
      - "infra/wrangler/**"
      - "shared/test-vectors.json"
      - "ui/**"
      - "worker/**"
      - ".github/workflows/ci-node.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
          cache: "pnpm"
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: test
        run: pnpm test
      - name: typecheck
        run: pnpm typecheck
      - name: build
        run: pnpm build
      - name: prepare local Wrangler config
        run: cp worker/wrangler.toml.example worker/wrangler.toml
      - name: apply D1 migrations locally
        run: pnpm --dir worker exec wrangler d1 migrations apply cf-mail-relay --local
      - name: Worker deploy dry-run
        run: pnpm --dir worker exec wrangler deploy --dry-run --outdir=.wrangler/build
      - name: demo deploy dry-run
        run: pnpm --dir demo exec wrangler deploy --dry-run --outdir=.wrangler/build
