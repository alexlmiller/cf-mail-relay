name: CI - OpenTofu

on:
  push:
    branches: [dev, main]
    paths:
      - "infra/opentofu/**"
      - ".github/workflows/ci-opentofu.yml"
  pull_request:
    paths:
      - "infra/opentofu/**"
      - ".github/workflows/ci-opentofu.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.11.5
          tofu_wrapper: false
      - run: tofu -chdir=infra/opentofu fmt -check -recursive
      - run: tofu -chdir=infra/opentofu init -backend=false -lockfile=readonly
      - run: tofu -chdir=infra/opentofu validate
