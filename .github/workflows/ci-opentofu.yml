name: CI - OpenTofu

on:
  push:
    branches: [dev, main]
    paths:
      - "infra/opentofu/**"
      - ".github/workflows/ci-opentofu.yml"
  pull_request:
    paths:
      - "infra/opentofu/**"
      - ".github/workflows/ci-opentofu.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # v2.0.1
        with:
          tofu_version: 1.11.5
          tofu_wrapper: false
      - run: tofu -chdir=infra/opentofu fmt -check -recursive
      - run: tofu -chdir=infra/opentofu init -backend=false -lockfile=readonly
      - run: tofu -chdir=infra/opentofu validate
