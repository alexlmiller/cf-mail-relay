name: release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          release-type: simple
          target-branch: main
          # Unified semver across relay, Worker, and UI.

  docker-push-relay:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          fetch-depth: 0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: validate release tag
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
          VERSION: ${{ needs.release-please.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing non-semver release tag: $VERSION" >&2
            exit 1
          fi
          tag_sha=$(git rev-list -n 1 "$VERSION")
          head_sha=$(git rev-parse HEAD)
          if [[ "$tag_sha" != "$RELEASE_SHA" || "$head_sha" != "$RELEASE_SHA" ]]; then
            echo "Release tag, release output, and checked-out commit do not match" >&2
            exit 1
          fi
      - name: check immutable version tag
        id: image
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
          REGISTRY_IMAGE: ghcr.io/${{ github.repository }}/relay
          SOURCE_URL: https://github.com/${{ github.repository }}
          VERSION: ${{ needs.release-please.outputs.tag }}
        run: |
          set -euo pipefail
          inspect_output=$(mktemp)
          if docker buildx imagetools inspect --raw "$REGISTRY_IMAGE:$VERSION" >"$inspect_output" 2>&1; then
            if ! jq -e --arg revision "$RELEASE_SHA" --arg source "$SOURCE_URL" --arg version "$VERSION" '
              .annotations["org.opencontainers.image.revision"] == $revision and
              .annotations["org.opencontainers.image.source"] == $source and
              .annotations["org.opencontainers.image.version"] == $version
            ' "$inspect_output" >/dev/null; then
              echo "Existing immutable image does not match release metadata; refusing to overwrite it" >&2
              jq '.annotations // {}' "$inspect_output" >&2
              exit 1
            fi
            echo "Version image already exists with matching release metadata; reusing it without overwrite."
            echo "exists=true" >>"$GITHUB_OUTPUT"
          elif grep -Eqi 'manifest unknown|not found' "$inspect_output"; then
            echo "exists=false" >>"$GITHUB_OUTPUT"
          else
            echo "Could not safely determine whether the version image exists" >&2
            cat "$inspect_output" >&2
            exit 1
          fi
      - name: build and push immutable version
        if: steps.image.outputs.exists != 'true'
        working-directory: relay
        env:
          GIT_SHA: ${{ needs.release-please.outputs.sha }}
          REGISTRY_IMAGE: ghcr.io/${{ github.repository }}/relay
          VERSION: ${{ needs.release-please.outputs.tag }}
        run: docker buildx bake --push --var GIT_SHA="$GIT_SHA" --var REGISTRY_IMAGE="$REGISTRY_IMAGE" --var VERSION="$VERSION"
      - name: verify published version
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
          REGISTRY_IMAGE: ghcr.io/${{ github.repository }}/relay
          SOURCE_URL: https://github.com/${{ github.repository }}
          VERSION: ${{ needs.release-please.outputs.tag }}
        run: |
          set -euo pipefail
          manifest=$(mktemp)
          docker buildx imagetools inspect --raw "$REGISTRY_IMAGE:$VERSION" >"$manifest"
          jq -e --arg revision "$RELEASE_SHA" --arg source "$SOURCE_URL" --arg version "$VERSION" '
            .annotations["org.opencontainers.image.revision"] == $revision and
            .annotations["org.opencontainers.image.source"] == $source and
            .annotations["org.opencontainers.image.version"] == $version
          ' "$manifest" >/dev/null
      - name: promote verified release to latest
        env:
          REGISTRY_IMAGE: ghcr.io/${{ github.repository }}/relay
          VERSION: ${{ needs.release-please.outputs.tag }}
        run: docker buildx imagetools create -t "$REGISTRY_IMAGE:latest" "$REGISTRY_IMAGE:$VERSION"
